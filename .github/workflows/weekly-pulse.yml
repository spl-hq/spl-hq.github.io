name: Weekly Pulse
# 📰 WS4: writes the SPL Weekly Pulse for the newest finished week (tools/pulse.py → gold data/Weekly_Pulse.json → league-data.js).
# Runs after every ESPN history pull, Tuesday 9 AM ET as a backstop, when the writer changes, or by hand (Run workflow; "force" rewrites).
# Claude writes it when the CLAUDE_CODE_OAUTH_TOKEN secret is set (Mike's subscription token); without it a plain template edition ships.
# Safe to re-run: a week Claude already wrote is left alone unless forced. Fails loudly (red Action + email) if Claude was expected but failed.
on:
  workflow_dispatch:
    inputs:
      force: { description: "Rewrite this week's edition", type: boolean, default: false }
  workflow_run:
    workflows: ["ESPN history pull"]
    types: [completed]
  schedule:
    - cron: "7 14 * * 2"
  push:
    branches: [main]
    paths: [".github/workflows/weekly-pulse.yml", "tools/pulse.py"]
permissions:
  contents: write
concurrency: { group: data-robots, cancel-in-progress: false }
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Claude Code (only if the token is set)
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm i -g @anthropic-ai/claude-code >/dev/null && claude --version; else echo "No CLAUDE_CODE_OAUTH_TOKEN secret, template edition"; fi
      - name: Write the Pulse
        id: write
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: python3 tools/pulse.py ${{ inputs.force && '--force' || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"
      - run: python3 tools/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "spl-hq-robot"; git config user.email "spl-hq-robot@users.noreply.github.com"
          git add data/Weekly_Pulse.json league-data.js
          git diff --cached --quiet || (git commit -m "Weekly Pulse: data/Weekly_Pulse.json + league-data.js" && bash tools/robot_push.sh)
      - name: Fail loudly if the writer failed
        if: steps.write.outputs.failed == '1'
        run: |
          echo "tools/pulse.py failed (see 'Write the Pulse' above). A template edition was saved if it got that far."; exit 1
