name: Build league data
# Rebuilds league-data.js (derived) whenever gold in data/ or the builder changes on main — e.g. Joe's rulebook edit,
# a new draft board, a date set in Season_Calendar.csv, a backfilled season. Safe to re-run: output depends only on data/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "tools/build_data.py", ".github/workflows/build-data.yml"]
permissions:
  contents: write
# One run per robot at a time. NOT one shared group: GitHub keeps only one pending run per group, so robots fired by the same push
# cancelled each other (11/26: history pull + build cancelled). Different robots racing is fine: tools/robot_push.sh rebases + rebuilds.
concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "spl-hq-robot"; git config user.email "spl-hq-robot@users.noreply.github.com"
          git add league-data.js player-history.js
          git diff --cached --quiet || (git commit -m "Build league data: league-data.js from data/" && bash tools/robot_push.sh)
