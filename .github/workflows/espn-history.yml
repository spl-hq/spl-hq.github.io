name: ESPN history pull
# Pulls every SPL season ESPN has into data/SPL_Matchups.csv (gold) and commits it.
# Runs every morning (Tuesday adds last week's finals), when this file or tools/pull_history.py changes on main, or by hand.
on:
  workflow_dispatch:
  # Automated upkeep (Mike 11/25): Tuesday morning adds last week's finals; Wednesday is a backstop
  # (GitHub schedules can run hours late). Re-running is safe: the file is rebuilt from ESPN each time.
  schedule:
    - cron: "17 11 * * *"   # daily (WS4): keeps data/SPL_Schedule.csv current for the Up next card (Shoot Out + playoff pairings land mid-week)
  push:
    branches: [main]
    paths: [".github/workflows/espn-history.yml", "tools/pull_history.py"]
permissions:
  contents: write
# One run per robot at a time. NOT one shared group: GitHub keeps only one pending run per group, so robots fired by the same push
# cancelled each other (11/26: history pull + build cancelled). Different robots racing is fine: tools/robot_push.sh rebases + rebuilds.
concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pull_history.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - run: python3 tools/build_data.py   # regenerate league-data.js (derived) from the new gold
      - name: Commit if changed
        run: |
          git config user.name "spl-hq-robot"; git config user.email "spl-hq-robot@users.noreply.github.com"
          git add data/SPL_Matchups.csv data/SPL_Schedule.csv docs/HISTORY_PULL_REPORT.md league-data.js
          git diff --cached --quiet || (git commit -m "ESPN history pull: data/SPL_Matchups.csv + league-data.js" && bash tools/robot_push.sh)
