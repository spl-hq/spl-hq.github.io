<style>
:root{
  --night:#111311; --surface:#1B1E1B; --raised:#232823; --line:#2C312C;
  --chalk:#EDEFE8; --muted:#9CA59C; --soft:#C2C9C0;
  --lime:#B8E04A; --coral:#FF7A59; --gold:#D9A94A;
  --head:"Big Shoulders Display","Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--chalk);font:15px/1.45 var(--body)}
/* App frame (from MAFFL REEL, iPhone-proven): header + scrolling middle + tab bar fill the screen; nothing floats over a scrolling page. */
body{display:flex;flex-direction:column;height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--lime)}
header{position:relative;flex:none;z-index:10;background:var(--night);border-bottom:1px solid var(--line);
  padding:calc(var(--top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.crest{width:auto;height:42px;flex:none;cursor:pointer;display:block}
header h1{margin:0;font:800 22px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;flex:1}
header h1 small{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em}
.pill{font:600 11px var(--mono);padding:4px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--lime)} .pill.bad{color:var(--coral)}
.dk{border:1px solid #96BEE6;border-radius:99px;background:transparent;color:#fff;font:800 12px var(--body);padding:6px 10px;cursor:pointer;white-space:nowrap}.dk[hidden]{display:none}.dk.on{background:#1E407C}
.me{border:0;border-radius:99px;background:var(--lime);color:var(--night);font:800 12px var(--body);padding:7px 11px;cursor:pointer;min-width:34px}
.phrase{font:700 22px var(--mono);letter-spacing:.04em;color:var(--lime);background:var(--night);border:1px dashed var(--lime);border-radius:12px;padding:14px;text-align:center;margin:10px 0;word-break:break-all}
main{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px max(14px, calc(50% - 266px)) 28px}
nav.tabs{position:relative;flex:none;z-index:10;padding-bottom:max(6px, calc(var(--bot) - 12px)) !important;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(var(--bot) + 6px)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font:600 11px var(--body);cursor:pointer}
nav.tabs button span{font-size:20px;line-height:1} nav.tabs .tcrest{display:block;width:20px;height:20px;object-fit:contain}
nav.tabs button.on{color:var(--lime)}
h2{font:800 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 12px}
h3{font:800 18px/1.1 var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.lead{background:var(--lime);color:var(--night);border-color:var(--lime)}
.card.lead .eyebrow{color:#2a3313}
.card p{margin:6px 0 0;color:var(--soft)} .card.lead p{color:#1f2610}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--lime);color:var(--night);text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--chalk);border:1px solid var(--line)}
.btn.dark{background:var(--night);color:var(--lime)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.back{background:none;border:0;color:var(--lime);font-weight:700;padding:0;margin-bottom:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;min-height:84px}
.tile b{display:block;font:800 16px var(--head);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}
.tile small{color:var(--muted);font-size:12px}
.tile.soon{opacity:.55}
.big{font:800 44px/1 var(--head)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono)}
.muted{color:var(--muted)} .coral{color:var(--coral)} .lime{color:var(--lime)} .gold{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--lime);color:var(--night);border-color:var(--lime);font-weight:700}
textarea,input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.q{counter-increment:q}
.q h3{font-size:16px;line-height:1.2}
.q h3::before{content:counter(q) ". ";color:var(--lime)}
.qlist{counter-reset:q}
.saved{font:600 11px var(--mono);color:var(--lime)}
.sticky{position:sticky;bottom:-28px;background:linear-gradient(transparent,var(--night) 30%);padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 80px);background:var(--chalk);color:var(--night);
  padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:last-child{text-align:right}
pre{white-space:pre-wrap;font:12px var(--mono);color:var(--soft)}
/* 🏠 Reel (ported from MAFFL REEL) */
.feedwrap{position:absolute;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ibar{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;min-height:36px}
.ihow{font:600 11px var(--body);color:var(--muted);margin-right:auto;margin-left:4px}
.icount{font:600 11px var(--mono);color:var(--muted)}
.saved{flex:none;padding:5px 10px;border-radius:99px;border:1.5px solid var(--gold);background:rgba(217,169,74,.12);color:var(--gold);font:700 12px var(--body);cursor:pointer}
.saved.dnc{border-color:var(--lime);background:rgba(184,224,74,.1);color:var(--lime)}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.fslot{height:100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;padding:6px 26px 10px 14px;display:flex;flex-direction:column;justify-content:center;position:relative}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:min(62%,460px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcard.hero{border-color:var(--lime)} .dcard.needs{border:2px solid var(--gold)}
.dcard.fly{transition:transform .25s ease-in,opacity .25s}
.dhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stamp{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.stamp.lg{background:#1d2b55;color:#fff} .stamp.me{background:var(--lime);color:var(--night)}
.acttag{font:800 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--gold);color:var(--night)}
.eb{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dt{font:800 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.02em;margin:2px 0 10px}
.dbody{flex:1}
.dbody .big{font-size:56px}
.story{font:600 16px/1.45 var(--body);color:var(--chalk);margin:10px 0 8px}
.dfoot{margin-top:14px}
.dbody .kv.mine{color:var(--lime)}
.endc{align-items:center;justify-content:center;text-align:center}
.zero{width:64px;height:64px;border-radius:50%;background:var(--lime);color:var(--night);font:800 30px/64px var(--head);text-align:center}
.irail{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.irail i{width:6px;height:6px;border-radius:50%;background:var(--line)} .irail i.on{background:var(--lime);height:16px;border-radius:4px}
.irail i.nd{background:var(--gold)} .irail i.end{background:transparent;border:1px solid var(--muted)}
.swu{position:absolute;left:24px;right:36px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none;font:800 15px var(--head);letter-spacing:.04em;text-transform:uppercase}
.swu span{opacity:0;transition:opacity .1s;padding:10px 14px;border-radius:99px}
.swu .sv{color:var(--night);background:var(--gold)} .swu .dn{color:var(--night);background:var(--lime)}
.undo{position:fixed;left:14px;bottom:calc(var(--bot) + 76px);transform:translateY(20px);opacity:0;z-index:30;display:flex;align-items:center;gap:14px;background:var(--chalk);color:var(--night);border-radius:12px;padding:8px 8px 8px 14px;font:600 14px var(--body);transition:.25s;pointer-events:none}
.undo.on{opacity:1;transform:none;pointer-events:auto}
.undo button{background:var(--night);color:var(--lime);border:0;border-radius:8px;padding:7px 12px;font:800 13px var(--body)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);overflow-y:auto;padding:calc(var(--top) + 30px) 0 calc(var(--bot) + 20px)}
.sheet .sbody{background:var(--night);border:1px solid var(--line);border-radius:20px;margin:0 10px;padding:16px;max-width:540px;margin:0 auto}
.sheet .dcard{min-height:0}
.bkbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px -6px 12px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.bka{flex:none;padding:6px 12px;border-radius:99px;border:1.5px solid var(--lime);background:transparent;color:var(--lime);font:700 13px var(--body);cursor:pointer}
.bka.home{background:var(--lime);color:#fff}.bka.sv{border-color:var(--gold);color:var(--gold)}
.bkold{margin-right:auto;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
/* WS4: rivalry grade, reactions, up next, votes, awards (docs/SPL_REEL_SERIES.md) */
.grade{display:inline-block;min-width:22px;height:22px;border-radius:6px;font:800 13px/22px var(--head);text-align:center;background:#D6DFEC;color:#0B1F3A}
.grade.gA{background:#B88A2E;color:#fff} .grade.gB{background:#1E407C;color:#fff} .grade.gC{background:#96BEE6;color:#041E42}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rx button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 9px;font-size:15px;line-height:1.2;cursor:pointer;opacity:.55}
.rx button.has{opacity:1} .rx button.on{border-color:var(--lime);background:rgba(30,64,124,.1);opacity:1}
.rx button b{font:700 11px var(--mono);margin-left:4px;vertical-align:1px}
.kv.tap{cursor:pointer;align-items:center} .kv.upn{align-items:center} .kv.upn>span:first-child{text-align:left;flex:1}
/* 🎨 Card kit (facelift 11/26): avatars, score bugs, chips, bars, meters, tiles, power rows */
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#041E42;color:#fff;font:800 13px var(--head);letter-spacing:.02em;flex:none}
.av.avme{background:#1E407C;box-shadow:0 0 0 2px #fff,0 0 0 4px #B88A2E} .av.lg{width:58px;height:58px;font-size:21px} .av.sm{width:24px;height:24px;font-size:10px}
.bug{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:4px 0 2px}
.bug .bl{display:flex;align-items:center;gap:12px;padding:12px 14px} .bug .bl+.bl{border-top:1px solid var(--line)}
.bug .bn{flex:1;min-width:0;line-height:1.2} .bug .bn b{display:block;font:700 17px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bug .bn small{font-size:12px;color:var(--muted)}
.bug .bp{font:800 30px var(--mono);color:var(--muted);letter-spacing:-.02em} .bug .bl.w{background:rgba(184,138,46,.12)} .bug .bl.w .bp{color:#1E407C}
.bug.mini{border-radius:12px;margin:0} .bug.mini .bl{padding:7px 9px;gap:7px} .bug.mini .bn b{font-size:14px} .bug.mini .bp{font-size:17px} .bug.mini .av{width:22px;height:22px;font-size:9px}
.bug.mini.mine{border-color:#B88A2E;box-shadow:0 0 0 1px #B88A2E}
.slate2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{font:700 12px var(--body);padding:6px 10px;border-radius:99px;background:#F2F5FA;border:1px solid var(--line);color:#0B1F3A}
.chips span.hi{border-color:#B88A2E;background:rgba(184,138,46,.12)} .chips span.bl{border-color:#1E407C;background:rgba(30,64,124,.08);color:#1E407C} .chips span.rd{border-color:#C8102E;color:#C8102E;background:rgba(200,16,46,.06)}
.hbars{margin-top:8px} .hbr{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.hbr i{display:block;height:12px;border-radius:6px;background:#1E407C} .hbr b{font:700 13px var(--mono);text-align:right} .hbr.mi span{font-weight:800} .hbr.mi i{background:#B88A2E}
.meter{height:12px;border-radius:6px;background:#E4EAF3;overflow:hidden;margin:10px 0 2px} .meter i{display:block;height:100%;border-radius:6px;background:#1E407C} .meter.over i{background:#C8102E}
.vs2{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;text-align:center;margin:6px 0 2px}
.vs2>div{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0} .vs2 b{font:700 17px var(--body)} .vs2 small{font-size:12px;color:var(--muted)}
.vs2 .mid{align-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 14px var(--head);color:#B88A2E;letter-spacing:.06em}
.vs2 .big2{font:800 40px/1 var(--mono);color:#041E42}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tl{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tl .lab{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)} .tl .num{font:800 32px/1.05 var(--mono);color:#041E42;letter-spacing:-.02em}
.tl .who{display:flex;align-items:center;gap:6px;font:700 14px var(--body)} .tl small{font-size:12px}
.tl.hot{background:rgba(184,138,46,.08)} .tl.cold{background:rgba(150,190,230,.16)}
.prow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)} .prow:last-child{border:0}
.prow .rk{font:800 26px var(--head);width:22px;text-align:center;color:#041E42} .prow .pt{flex:1;min-width:0;line-height:1.25} .prow .pt b{font-size:16px} .prow .pt small{display:block;font-size:12.5px;color:var(--muted)}
.prow .pr{font:700 14px var(--mono)} .prow.p3{border:0;padding-bottom:4px} .prow .pt small.p3t{font-size:13.5px;color:#0B1F3A;margin-top:2px} .p3s{display:grid;grid-template-columns:.9fr 1fr 1.25fr;gap:6px;margin:2px 0 10px 34px;padding-bottom:12px;border-bottom:1px solid var(--line)} .p3s:last-of-type{border:0;padding-bottom:4px} .p3s>div{background:#F2F5FA;border-radius:10px;padding:6px 7px;min-width:0} .p3s i{display:block;font:700 10px var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)} .p3s b{display:block;font:800 17px/1.2 var(--mono);color:#041E42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .p3s b.w{color:#1E407C} .p3s b.l{color:#C8102E} .p3s small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .prow.mine{background:rgba(184,138,46,.10);margin:0 -10px;padding:9px 10px;border-radius:10px}
.up{color:#1E407C;font:700 11px var(--mono);margin-left:4px} .dn{color:#C8102E;font:700 11px var(--mono);margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px} .tbl td{padding:7px 2px;border-bottom:1px solid var(--line)} .tbl td.n{text-align:right;font-family:var(--mono)} .tbl tr.mine td{background:rgba(184,138,46,.10);font-weight:700}

.byline{display:flex;align-items:center;gap:10px} .byline b{font-size:16px} .byline small{display:block;color:var(--muted);font-size:12px}
.sub{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}

.vt{margin-top:4px}

.vopt .vb{flex:1;position:relative;z-index:1} .vopt .vp{font:700 12px var(--mono);position:relative;z-index:1}
.vopt .vbar{position:absolute;left:0;top:0;bottom:0;background:rgba(30,64,124,.08)}
.vopt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)} .vopt.right{border-color:#1E407C;box-shadow:0 0 0 2px #1E407C} .vopt.wrong{border-color:#C8102E} .vopt.dim{opacity:.6}

/* ===== "Limestone" gray layer (Mike 11/26): Penn State's gray for structure; blue stays for anything you tap, win or own.
   Canvas, lines, labels, tab bar and quiet chips go neutral gray so white cards pop. Delete this block to go back to all-blue Nittany. ===== */
:root{ --raised:#F1F2F4; --line:#D9DCE0; --muted:#5F666D; --soft:#3C4248; }
main{background:#E8EAED}
header{box-shadow:inset 0 -3px 0 #A2AAAD}

// 📱 Home Screen height fix (Mike's screenshots 11/25): an iPhone Home Screen app with a see-through status bar reports a
// viewport one status-bar shorter than the screen, so a 100dvh frame stops ~54 pt above the bottom edge. Size the frame to the
// real screen when installed + portrait; in a browser innerHeight is right and nothing changes.
(function () {
  function fit() {
    var sa = window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    var h = window.innerHeight;
    if (sa && matchMedia("(orientation: portrait)").matches && screen.height > h) h = screen.height;
    document.body.style.height = h + "px";
    document.documentElement.classList.toggle("sa", !!sa); // installed: header clears iOS's status-bar blur zone
  }
  document.addEventListener("DOMContentLoaded", fit); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  window._fit = fit;
})();
</script>

function injAb(s) { var k = String(s || "").toUpperCase().replace(/[\s-]+/g, "_"); return { OUT: "O", QUESTIONABLE: "Q", DOUBTFUL: "D", PROBABLE: "P", INJURY_RESERVE: "IR", INJURED_RESERVE: "IR", SUSPENSION: "SSPD", SUSPENDED: "SSPD", DAY_TO_DAY: "DTD", PUP: "PUP" }[k] || String(s || ""); }

function teamOwner(name) { var n = String(name || "").toLowerCase(); return OWNERS.filter(function (o) { return o.team.toLowerCase() === n; })[0]; }
function api(action, body) {

    function () { if (typeof pingConn === "function") pingConn(); throw new Error(navigator.onLine ? "Couldn't reach SPL HQ. Check your signal and try again." : "You're offline: nothing was sent. Try again when you have signal."); });

// ⚡ Speed (Mike 11/26: "lots of load times"): screens draw from the last copy kept on this phone, then refresh in the background.

function keep(k, v) { if (v && v.ok !== false) store("c_" + k, { o: ME ? ME.owner : "", at: Date.now(), v: v }); }
function kept(k, maxH) { var c = store("c_" + k); return c && c.o === (ME ? ME.owner : "") && Date.now() - c.at < (maxH || 24) * 36e5 ? c.v : null; }

// ---- session: passphrase once → device token kept on this phone (a new passphrase signs old phones out)
var ME = store("me"), MY = {};

}

<script>
// ✨ Update check (from MAFFL REEL): a Home-Screen app keeps running the copy it loaded. Fingerprint this copy's own inline

(function () {

  function busyTyping() { var a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || Array.prototype.some.call(document.querySelectorAll("textarea"), function (x) { return x.value.trim(); }); }

    var away = hiddenAt && Date.now() - hiddenAt >= 6e5; if (away) last = 0; check(away); });
