<!-- SPL HQ app · v0.13.1 · 2026-11-26. Plan: docs/SPL_REEL_PLAN.md. Rules: CLAUDE.md. -->
<style>
:root{
  --night:#111311; --surface:#1B1E1B; --raised:#232823; --line:#2C312C;
  --chalk:#EDEFE8; --muted:#9CA59C; --soft:#C2C9C0;
  --lime:#B8E04A; --coral:#FF7A59; --gold:#D9A94A;
  --head:"Big Shoulders Display","Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:var(--night);color:var(--chalk);font:15px/1.45 var(--body)}
/* App frame (from MAFFL REEL, iPhone-proven): header + scrolling middle + tab bar fill the screen; nothing floats over a scrolling page. */
body{display:flex;flex-direction:column;height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--lime)}
header{position:relative;flex:none;z-index:10;background:var(--night);border-bottom:1px solid var(--line);
  padding:calc(var(--top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.crest{width:auto;height:42px;flex:none;cursor:pointer;display:block}
header h1{margin:0;font:800 22px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;flex:1}
header h1 small{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em}
.pill{font:600 11px var(--mono);padding:4px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--lime)} .pill.bad{color:var(--coral)}
.dk{border:1px solid #96BEE6;border-radius:99px;background:transparent;color:#fff;font:800 12px var(--body);padding:6px 10px;cursor:pointer;white-space:nowrap}.dk[hidden]{display:none}.dk.on{background:#1E407C}
.me{border:0;border-radius:99px;background:var(--lime);color:var(--night);font:800 12px var(--body);padding:7px 11px;cursor:pointer;min-width:34px}
.phrase{font:700 22px var(--mono);letter-spacing:.04em;color:var(--lime);background:var(--night);border:1px dashed var(--lime);border-radius:12px;padding:14px;text-align:center;margin:10px 0;word-break:break-all}
main{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px max(14px, calc(50% - 266px)) 28px}
nav.tabs{position:relative;flex:none;z-index:10;padding-bottom:max(6px, calc(var(--bot) - 12px)) !important;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(var(--bot) + 6px)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font:600 11px var(--body);cursor:pointer}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--lime)}
h2{font:800 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 12px}
h3{font:800 18px/1.1 var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.lead{background:var(--lime);color:var(--night);border-color:var(--lime)}
.card.lead .eyebrow{color:#2a3313}
.card p{margin:6px 0 0;color:var(--soft)} .card.lead p{color:#1f2610}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--lime);color:var(--night);text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--chalk);border:1px solid var(--line)}
.btn.dark{background:var(--night);color:var(--lime)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.back{background:none;border:0;color:var(--lime);font-weight:700;padding:0;margin-bottom:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;min-height:84px}
.tile b{display:block;font:800 16px var(--head);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}
.tile small{color:var(--muted);font-size:12px}
.tile.soon{opacity:.55}
.big{font:800 44px/1 var(--head)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono)}
.muted{color:var(--muted)} .coral{color:var(--coral)} .lime{color:var(--lime)} .gold{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--lime);color:var(--night);border-color:var(--lime);font-weight:700}
textarea,input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.q{counter-increment:q}
.q h3{font-size:16px;line-height:1.2}
.q h3::before{content:counter(q) ". ";color:var(--lime)}
.qlist{counter-reset:q}
.saved{font:600 11px var(--mono);color:var(--lime)}
.sticky{position:sticky;bottom:-28px;background:linear-gradient(transparent,var(--night) 30%);padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 80px);background:var(--chalk);color:var(--night);
  padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:last-child{text-align:right}
pre{white-space:pre-wrap;font:12px var(--mono);color:var(--soft)}
/* 🏠 Reel (ported from MAFFL REEL) */
.feedwrap{position:absolute;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ibar{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;min-height:36px}
.ihow{font:600 11px var(--body);color:var(--muted);margin-right:auto;margin-left:4px}
.icount{font:600 11px var(--mono);color:var(--muted)}
.saved{flex:none;padding:5px 10px;border-radius:99px;border:1.5px solid var(--gold);background:rgba(217,169,74,.12);color:var(--gold);font:700 12px var(--body);cursor:pointer}
.saved.dnc{border-color:var(--lime);background:rgba(184,224,74,.1);color:var(--lime)}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.fslot{height:100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;padding:6px 26px 10px 14px;display:flex;flex-direction:column;justify-content:center;position:relative}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:min(62%,460px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dcard.hero{border-color:var(--lime)} .dcard.needs{border:2px solid var(--gold)}
.dcard.fly{transition:transform .25s ease-in,opacity .25s}
.dhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stamp{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.stamp.lg{background:#1d2b55;color:#fff} .stamp.me{background:var(--lime);color:var(--night)}
.acttag{font:800 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--gold);color:var(--night)}
.eb{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dt{font:800 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.02em;margin:2px 0 10px}
.dbody{flex:1}
.dbody .big{font-size:56px}
.story{font:600 16px/1.45 var(--body);color:var(--chalk);margin:10px 0 8px}
.dfoot{margin-top:14px}
.dbody .kv.mine{color:var(--lime)}
.endc{align-items:center;justify-content:center;text-align:center}
.zero{width:64px;height:64px;border-radius:50%;background:var(--lime);color:var(--night);font:800 30px/64px var(--head);text-align:center}
.irail{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.irail i{width:6px;height:6px;border-radius:50%;background:var(--line)} .irail i.on{background:var(--lime);height:16px;border-radius:4px}
.irail i.nd{background:var(--gold)} .irail i.end{background:transparent;border:1px solid var(--muted)}
.swu{position:absolute;left:24px;right:36px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none;font:800 15px var(--head);letter-spacing:.04em;text-transform:uppercase}
.swu span{opacity:0;transition:opacity .1s;padding:10px 14px;border-radius:99px}
.swu .sv{color:var(--night);background:var(--gold)} .swu .dn{color:var(--night);background:var(--lime)}
.undo{position:fixed;left:14px;bottom:calc(var(--bot) + 76px);transform:translateY(20px);opacity:0;z-index:30;display:flex;align-items:center;gap:14px;background:var(--chalk);color:var(--night);border-radius:12px;padding:8px 8px 8px 14px;font:600 14px var(--body);transition:.25s;pointer-events:none}
.undo.on{opacity:1;transform:none;pointer-events:auto}
.undo button{background:var(--night);color:var(--lime);border:0;border-radius:8px;padding:7px 12px;font:800 13px var(--body)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);overflow-y:auto;padding:calc(var(--top) + 30px) 0 calc(var(--bot) + 20px)}
.sheet .sbody{background:var(--night);border:1px solid var(--line);border-radius:20px;margin:0 10px;padding:16px;max-width:540px;margin:0 auto}
.sheet .dcard{min-height:0}
/* WS4: rivalry grade, reactions, up next, pulse */
.grade{display:inline-block;min-width:22px;height:22px;border-radius:6px;font:800 13px/22px var(--head);text-align:center;background:#D6DFEC;color:#0B1F3A}
.grade.gA{background:#B88A2E;color:#fff} .grade.gB{background:#1E407C;color:#fff} .grade.gC{background:#96BEE6;color:#041E42}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rx button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 9px;font-size:15px;line-height:1.2;cursor:pointer;opacity:.55}
.rx button.has{opacity:1} .rx button.on{border-color:var(--lime);background:rgba(30,64,124,.1);opacity:1}
.rx button b{font:700 11px var(--mono);margin-left:4px;vertical-align:1px}
.kv.tap{cursor:pointer;align-items:center} .kv.upn{align-items:center} .kv.upn>span:first-child{text-align:left;flex:1}
.pg{border-bottom:1px solid var(--line);padding:6px 0} .pg:last-child{border:0} .pg p{margin:2px 0 4px;font-size:14px}

nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:2px;left:55%;background:var(--coral);color:#fff;font:700 10px var(--body);border-radius:99px;padding:1px 5px}
.hscroll{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stepper button{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.stepper button:disabled{opacity:.3}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .sc{font:800 40px/1 var(--head)} .vs .tn{font:800 14px/1.15 var(--head);text-transform:uppercase;letter-spacing:.03em}
.vs .meta{font:11px var(--mono);color:var(--muted)}
.vs .win .sc{color:var(--lime)}
.lu{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.lu td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:top}
.lu td.sl{width:42px;text-align:center;font:600 10px var(--mono);color:var(--muted);vertical-align:middle}
.lu .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .pt{font:700 13px var(--mono)} .lu .r{text-align:right}
.game{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.game:last-child{border:0}
.game .s{font:700 14px var(--mono);text-align:right}
.game .w{color:var(--lime)} .game.mine{background:linear-gradient(90deg,rgba(184,224,74,.08),transparent)}
.ro td{padding:8px 4px}
.tag{display:inline-block;font:700 9.5px var(--mono);padding:2px 5px;border-radius:5px;background:var(--raised);color:var(--gold);border:1px solid var(--line);vertical-align:1px}
.inj{color:var(--coral);font:700 10px var(--mono)}
.rooms .kv{cursor:pointer;align-items:center}
.unread{background:var(--coral);color:#fff;border-radius:99px;font:700 11px var(--body);padding:2px 7px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.msg{max-width:80%;padding:8px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--lime);color:var(--night);border-color:var(--lime)}
.msg .who{font:700 11px var(--body);color:var(--gold);margin-bottom:2px}
.msg .t{font:10px var(--mono);opacity:.6;margin-top:3px}
.msg.del{opacity:.5;font-style:italic}
.msg.hq{align-self:center;max-width:92%;background:var(--raised);border-color:var(--gold)}
.offer .grid{grid-template-columns:1fr 1fr}
.composer{position:sticky;bottom:-28px;margin:0 -14px;background:var(--night);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;z-index:9}
.composer textarea{min-height:40px;max-height:120px;height:40px;flex:1;padding:9px 10px}
/* ===== "Nittany" theme (Mike 11/25): Penn State blue + white. Replaces Stadium Lights. ===== */
:root{
  --night:#FFFFFF; --surface:#FFFFFF; --raised:#EEF3FA; --line:#D6DFEC;
  --chalk:#0B1F3A; --muted:#5D6E89; --soft:#33465F;
  --lime:#1E407C; --gold:#B88A2E; --coral:#C8102E;
}
html,body{background:#041E42} main{background:#F2F5FA}
/* Installed on the Home Screen, iOS softly blurs a band just below the status bar: drop the header contents below it. */
html.sa header{padding-top:calc(var(--top) + 26px)} html.sa .upd{top:calc(var(--top) + 92px)} header{-webkit-backdrop-filter:none;backdrop-filter:none}
header{background:#041E42;border-bottom:0;color:#fff}
header h1 small{color:#96BEE6}
header .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#cfe0f5}
header h1{min-width:0} header h1 small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} header .pill.ok{color:#96BEE6} .pill[hidden]{display:none} header .pill.bad{color:#ffc2ca;border-color:rgba(255,120,140,.5);cursor:pointer}
header .me{background:#fff;color:#041E42}
nav.tabs{background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(4,30,66,.06)}
nav.tabs button.on{color:#041E42}
.card,.dcard,.tile{box-shadow:0 1px 3px rgba(4,30,66,.08)}
.card.lead{background:linear-gradient(135deg,#041E42,#1E407C);border:0;color:#fff}
.card.lead .eyebrow{color:#96BEE6} .card.lead p{color:#dbe7f6}
.dcard.hero{border:2px solid #1E407C} .dcard.needs{border:2px solid #B88A2E}
.stamp.me{background:#1E407C;color:#fff} .stamp.lg{background:#041E42;color:#fff}
.acttag{background:#B88A2E;color:#fff}
.vs .win .sc,.lime{color:#1E407C}
.zero{background:#1E407C;color:#fff}
.irail i.on{background:#1E407C}
.swu .dn{background:#1E407C;color:#fff} .swu .sv{background:#B88A2E;color:#fff}
.undo{background:#041E42;color:#fff} .undo button{background:#96BEE6;color:#041E42}
.saved{background:#FFF6E3} .saved.dnc{background:#E8F0FB;border-color:#1E407C;color:#1E407C}
.game.mine{background:linear-gradient(90deg,rgba(30,64,124,.08),transparent)}
.msg.me{background:#1E407C;color:#fff;border-color:#1E407C}
.tag{background:#EEF3FA;color:#8A6516;border-color:#E3D3AE}
textarea,input[type=text],select{background:#fff}
.btn.ghost{background:#fff;color:#1E407C;border-color:#C9D6EA}
.chip{background:#fff}
.chip.on{background:#1E407C;color:#fff;border-color:#1E407C}
.feedwrap{background:transparent}

/* 📖 📚 🔒 📝 🎓 League screens (WS2) */
.st{display:inline-block;font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;vertical-align:middle;white-space:nowrap}
.st.current{background:#E8F0FB;color:#1E407C} .st.confirm{background:#FFF6E3;color:#8A6516} .st.stale{background:#FBE9EC;color:#C8102E} .st.ok{background:#E8F0FB;color:#1E407C}
details.sec{padding:0} details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary b{flex:1;font:800 16px/1.15 var(--head);text-transform:uppercase;letter-spacing:.03em}
details.sec>summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s} details.sec[open]>summary::after{transform:rotate(90deg)}
.rbody{padding:0 16px 14px;font-size:14px;line-height:1.5} .rbody ol,.rbody ul{padding-left:20px;margin:6px 0} .rbody li{margin:4px 0} .rbody p{margin:8px 0;color:var(--chalk)}
.rnote{font-size:12px;color:var(--muted);margin:0 16px 10px;padding:8px 10px;border-radius:10px;background:#F7F9FC}
table.rb{font-size:13px;margin:8px 0} table.rb td,table.rb th{padding:6px 4px}
mark{background:#FFE9A8;color:inherit;border-radius:3px}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EEF3FA;margin:10px 0 6px}
.meter i{display:block;height:100%} .meter .k{background:#1E407C} .meter .p{background:#C8102E} .meter .h{background:#96BEE6}
.cand{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px} .cand:last-child{border:0}
.cand span{flex:1;min-width:0} .cand button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font:700 12px var(--mono);cursor:pointer;color:#1E407C}
.trophy{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer} .trophy:last-child{border:0}
.trophy .yr{font:800 22px/1 var(--head);width:52px;flex:none;color:#1E407C} .trophy .yr.gap{color:var(--muted)}
.trophy div{flex:1;min-width:0} .trophy small{color:var(--muted)}
.fin{font:700 10px var(--mono);padding:2px 6px;border-radius:5px;background:#EEF3FA;color:var(--muted);white-space:nowrap}

<script>
// 📱 Home Screen height fix (Mike's screenshots 11/25): an iPhone Home Screen app with a see-through status bar reports a
// viewport one status-bar shorter than the screen, so a 100dvh frame stops ~54 pt above the bottom edge. Size the frame to the
// real screen when installed + portrait; in a browser innerHeight is right and nothing changes.
(function () {
  function fit() {
    var sa = window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    var h = window.innerHeight;
    if (sa && matchMedia("(orientation: portrait)").matches && screen.height > h) h = screen.height;
    document.body.style.height = h + "px";
    document.documentElement.classList.toggle("sa", !!sa); // installed: header clears iOS's status-bar blur zone
  }
  document.addEventListener("DOMContentLoaded", fit); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  window._fit = fit;
})();
</script>

<script>
"use strict";

var QUESTIONS = [
  { qid: "espn_lm", q: "Will you make Mike's team a league manager (co-commish) in SPL on ESPN?",

  { qid: "keeper_travels", retired: "Mike: travels as-is → folded into mike_calls", q: "When a player under a keeper contract is traded, what happens to the contract?",

    why: "Dates lock buttons in the app, start the countdown cards and open the draft rooms. Rough is fine (\"first Saturday in August\"); you can change them anytime.",

    choices: ["Yes, run it that way", "Yes, and I can overrule", "No, I approve every trade", "Other (explain)"] },
  { qid: "mike_calls", q: "Mike made these calls for the app. Good with all three?",

    choices: ["All good", "Change one (explain below)"] },
  { qid: "chat_move", q: "League chat is live in the app (plus trade DMs). Move the league's talk here?",
    why: "Everyone gets it once they sign in. The group text can stay for whatever you like.",
    choices: ["Yes, move the league here", "Both for now", "Keep the group text, app chat for trades"] }
];
var Q_ORDER = ["espn_lm", "test_league", "veto_vote", "mike_calls", "deadlines", "chat_move", "first_wish"]; // the order Joe sees
var ACTIVE_Q = QUESTIONS.filter(function (q) { return !q.retired; }).sort(function (a, b) { return Q_ORDER.indexOf(a.qid) - Q_ORDER.indexOf(b.qid); });
function answeredActive(ans) { return ACTIVE_Q.filter(function (q) { return ans[q.qid]; }).length; }

// ---- tiny helpers
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2600); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("spl_" + k) || "null"); localStorage.setItem("spl_" + k, JSON.stringify(v)); } catch (e) { return null; } }
function owner(id) { return OWNERS.filter(function (o) { return o.id === id; })[0]; }
function teamOwner(name) { var n = String(name || "").toLowerCase(); return OWNERS.filter(function (o) { return o.team.toLowerCase() === n; })[0]; }
function api(action, body) {
  if (!API_URL) return Promise.reject(new Error("Backend not connected yet"));
  if (!body) return fetch(API_URL + "?action=" + action).then(function (r) { return r.json(); });
  body.action = action;
  if (!navigator.onLine) return Promise.reject(new Error("You're offline: nothing was sent. Try again when you have signal."));
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); },
    function () { if (typeof pingConn === "function") pingConn(); throw new Error(navigator.onLine ? "Couldn't reach SPL HQ. Check your signal and try again." : "You're offline: nothing was sent. Try again when you have signal."); });
}
var cache = {};
function load(action, maxAgeMs) {
  var c = cache[action]; if (c && Date.now() - c.at < (maxAgeMs || 60000)) return Promise.resolve(c.data);
  return api(action).then(function (d) { cache[action] = { at: Date.now(), data: d }; return d; });
}

// ---- session: passphrase once → device token kept on this phone (a new passphrase signs old phones out)
var ME = store("me"), MY = {};
function isRole(r) { return !!ME && String(ME.role || "").split(/[,\s]+/).indexOf(r) >= 0; }
function isDesk() { return isRole("commish") || isRole("ops"); }

    '<h2>' + (which === "ops" ? "🛠️ Ops desk" : "📥 Commish desk") + '</h2>';

function fullOf(id) { var o = (window.LEAGUE_DATA && LEAGUE_DATA.owners || []).filter(function (x) { return x.id === id; })[0]; return o && o.full; } // Owner Registry canonical_name

  var d = $("#deskBtn"); if (d) { d.hidden = !isDesk(); var qOpen = isOps() ? 0 : ACTIVE_Q.length - answeredActive(MY || {}); d.textContent = isOps() ? "🛠️ Desk" : "📥 Desk" + (qOpen > 0 ? " · " + qOpen : ""); d.setAttribute("aria-label", isOps() ? "Ops desk" : "Commish desk"); }
}

    };

}
function needSignIn(what) {

// ---- router
var SCREENS = {}, TAB_OF = { signin: "home", you: "home", settings: "home", home: "home", match: "match", team: "team", chat: "chat", league: "league", standings: "league", joe: "", feedback: "league", ops: "", soon: "league", trades: "team", trade: "team", desk: "", rivalry: "league", rules: "league", keepers: "league", draft: "league", history: "league", gm: "league", offseason: "league", droom: "league", pulse: "league" };

// ---- 🏠 Home = the reel (ported from MAFFL REEL, 11/8–11/9 rules): one card per screen, scroll up for the next.
// Swipe ← = ✓ Done (gone for the week), → = ⭐ Save (kept up top until you act on it). "Needs you" cards lead and can't be

var FEED = [], FEED_N = 0, FPOS = 0, DONE_DAYS = 7;
function fk(k) { return "fd_" + k + "_" + (ME ? ME.owner : "guest"); }
function wkMap(kind, wk) { return store(fk(kind) + "_" + wk) || {}; }
function bk(kind) {

  if (kind === "clr") { var cut = Date.now() - DONE_DAYS * 864e5, b = a.filter(function (x) { return x.at > cut; }); if (b.length !== a.length) { a = b; store(fk("bk_" + kind), a); } }

    '<span class="eb">' + x.eb + '</span></div>' + (x.title ? '<h3 class="dt">' + x.title + '</h3>' : '') + '<div class="dbody">' + x.body + '</div>' +
    (x.rk && ME ? rxBar(x.rk) : '') + (x.action ? '<div class="dfoot"><button class="btn' + (x.needs ? "" : " ghost") + '" onclick="' + x.action[1] + '">' + x.action[0] + '</button></div>' : '') + '</div>';
}

SCREENS.chat.after = function (room) {
  if (!ME) return;
  if (!room) {
    var drawRooms = function () {
      var list = CHAT.rooms.slice(); if (!list.some(function (r) { return r.room === "league"; })) list.unshift({ room: "league", n: 0 });
      list.sort(function (a, b) { return (a.room === "league" ? -1 : 0) - (b.room === "league" ? -1 : 0) || new Date(b.last || 0) - new Date(a.last || 0); });
      if ($("#rooms")) $("#rooms").innerHTML = '<div class="eyebrow">💬 Rooms</div>' + list.map(function (r) {
        var un = r.who !== ME.owner && r.last && new Date(r.last).getTime() > seen(r.room);
        return '<div class="kv" onclick="go(\'chat\',\'' + r.room + '\')"><span><b>' + (r.room === "league" ? "🏟️ " : "👤 ") + esc(roomName(r.room)) + '</b><br><small class="muted">' +
          (r.text ? (r.who === "hq" ? "SPL HQ" : esc(oname(r.who))) + ': ' + esc(r.text) : "No messages yet") + '</small></span><span>' + (un ? '<span class="unread">new</span>' : (r.last ? '<small class="muted">' + ago(r.last) + '</small>' : '')) + '</span></div>';
      }).join("");
    };
    drawRooms(); pollRooms().then(drawRooms); timers.push(setInterval(function () { if (!document.hidden) pollRooms().then(drawRooms); }, 20000));
    return;
  }
  var msgs = [], last = null;
  var draw = function () {
    var el = $("#msgs"); if (!el) return;
    var V = $("#view"), atBottom = V.scrollTop + V.clientHeight >= V.scrollHeight - 80;
    el.innerHTML = msgs.length ? msgs.map(function (m) {
      var mine = m.who === ME.owner, t = new Date(m.ts);
      if (m.who === "hq") return '<div class="msg hq"><div class="who">SPL HQ</div>' + esc(m.text) + (m.ref ? '<div style="margin-top:6px"><button class="back" onclick="go(\'trades\',\'' + esc(m.ref) + '\')">Open trade ›</button></div>' : '') + '<div class="t">' + t.toLocaleDateString([], { month: "short", day: "numeric" }) + ' ' + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + '</div></div>';
      return '<div class="msg' + (mine ? " me" : "") + (m.del ? " del" : "") + '" ' + (mine && !m.del ? 'onclick="delMsg(\'' + esc(m.id) + '\')"' : (isRole("commish") && room === "league" && !m.del ? 'onclick="delMsg(\'' + esc(m.id) + '\')"' : '')) + '>' +
        (!mine && room === "league" ? '<div class="who">' + esc(oname(m.who)) + '</div>' : '') + (m.del ? "Message deleted" : esc(m.text).replace(/\n/g, "<br>")) +
        '<div class="t">' + t.toLocaleDateString([], { month: "short", day: "numeric" }) + ' ' + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + '</div></div>';
    }).join("") : '<p class="muted">No messages yet. Say something.</p>';
    el.innerHTML += (store("outbox") || []).filter(function (m) { return m.room === room; }).map(function (m) {
      return '<div class="msg me" style="opacity:.6">' + esc(m.text).replace(/\n/g, "<br>") + '<div class="t">⏳ Waiting for signal, sends when you\'re back</div></div>'; }).join("");
    if (atBottom || !last) V.scrollTop = V.scrollHeight;
  };
  var pull = function () {
    return authed("chat", { room: room }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      msgs = r.msgs; last = msgs.length ? msgs[msgs.length - 1].ts : last; CHAT.rooms = r.rooms; seen(room, Date.now()); paintBadge(); draw();
    }).catch(function (e) { if (!navigator.onLine) return draw(); if ($("#msgs")) $("#msgs").innerHTML = '<p class="coral">' + esc(e.message) + '</p>'; });
  };
  pull(); timers.push(setInterval(function () { if (!document.hidden) pull(); }, 8000));
  window.delMsg = function (id) { if (!confirm("Delete this message?")) return; authed("chatdel", { id: id }).then(function (r) { if (!r.ok) throw new Error(r.error); pull(); }).catch(function (e) { toast(e.message); }); };
  var send = function () {
    var ta = $("#cmsg"), text = ta.value.trim(); if (!text) return;
    if (!navigator.onLine) { var ob = store("outbox") || []; ob.push({ room: room, text: text, ts: new Date().toISOString() }); store("outbox", ob); ta.value = ""; draw(); toast("Offline: it'll send when you're back"); return; }
    var btn = $("#csend"); btn.disabled = true;
    authed("chatsend", { room: room, text: text }).then(function (r) {
      if (!r.ok) throw new Error(r.error); ta.value = ""; msgs.push(r.msg); draw(); $("#view").scrollTop = $("#view").scrollHeight;
    }).catch(function (e) { toast(e.message); }).then(function () { btn.disabled = false; });
  };
  $("#csend").onclick = send;

};

// 🔒 Keepers: contract table + 2027 cap forecaster (what my keepers cost, room left, try a signing) + Signing Day countdown.
var KP_ROUND = function (r) { return !r ? 2 : r === 1 ? 10 : r === 2 ? 8 : r === 3 ? 6 : r <= 5 ? 4 : r <= 8 ? 3 : 2; };

  if (sd && sd.date) return { y: y, date: sd.date };
  if (dr && dr.date) { var d = new Date(dr.date + "T12:00"); d.setDate(d.getDate() - 10); return { y: y, date: d.toISOString().slice(0, 10), from: "draft" }; }

SCREENS.keepers = function (arg) {

  var tot = function (y) { var k = 0, p = 0, h = 0;
    carried.forEach(function (c) { k += num(c.kp[y]); }); cs.forEach(function (c) { if (c.status !== "active" && c.pen) p += num(c.pen[y]); });
    plan.forEach(function (x) { var i = y - y0; if (i < x.term) h += x.cost + i; }); return { k: k, p: p, h: h, room: 10 - k - p - h }; };

    LD("contracts").slice().sort(function (a, b) { return a.owner < b.owner ? -1 : a.owner > b.owner ? 1 : 0; }).map(function (c) { var v = c.status === "active" ? c.kp[y0 - 1] : c.pen[y0 - 1];
      return '<tr><td>' + esc(c.player) + ' <small class="muted">' + esc(c.pos) + '</small>' + (c.tag ? ' <span class="tag">TAG</span>' : '') + (c.status !== "active" ? ' <span class="tag" style="color:var(--coral)">' + esc(c.status.toUpperCase()) + '</span>' : '') + '</td><td>' + esc(oname(c.owner)) + '</td><td class="n">' + c.signed + '+' + c.term + '</td><td class="n' + (c.status !== "active" ? " coral" : "") + '">' + (v == null ? "·" : v) + '</td></tr>'; }).join("") +

SCREENS.keepers.after = function (arg) {

      (blocked ? '' : [1, 2, 3].map(function (t) { return '<button onclick="kpAdd(\'' + id + '\',' + (KCAND.push({ n: name, r: r }) - 1) + ',' + t + ')">' + t + 'y</button>'; }).join("")) + '</div>';
