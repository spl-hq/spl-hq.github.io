<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPL HQ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<title>SPL HQ</title>
<!-- SPL HQ app · v0.3 · 2026-11-25. Plan: docs/SPL_REEL_PLAN.md. Rules: CLAUDE.md. -->
<style>
:root{
  --night:#111311; --surface:#1B1E1B; --raised:#232823; --line:#2C312C;
  --chalk:#EDEFE8; --muted:#9CA59C; --soft:#C2C9C0;
  --lime:#B8E04A; --coral:#FF7A59; --gold:#D9A94A;
  --head:"Big Shoulders Display","Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--chalk);font:15px/1.45 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--lime)}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--night);border-bottom:1px solid var(--line);
  padding:calc(var(--top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.crest{width:auto;height:42px;flex:none;cursor:pointer;display:block}
header h1{margin:0;font:800 22px/1 var(--head);letter-spacing:.04em;text-transform:uppercase;flex:1}
header h1 small{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.06em}
.pill{font:600 11px var(--mono);padding:4px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--lime)} .pill.bad{color:var(--coral)}
.me{border:0;border-radius:99px;background:var(--lime);color:var(--night);font:800 12px var(--body);padding:7px 11px;cursor:pointer;min-width:34px}
.phrase{font:700 22px var(--mono);letter-spacing:.04em;color:var(--lime);background:var(--night);border:1px dashed var(--lime);border-radius:12px;padding:14px;text-align:center;margin:10px 0;word-break:break-all}
main{padding:calc(var(--top) + 76px) 14px calc(var(--bot) + 86px);max-width:560px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(var(--bot) + 6px)}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font:600 11px var(--body);cursor:pointer}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--lime)}
h2{font:800 26px/1.05 var(--head);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 12px}
h3{font:800 18px/1.1 var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.lead{background:var(--lime);color:var(--night);border-color:var(--lime)}
.card.lead .eyebrow{color:#2a3313}
.card p{margin:6px 0 0;color:var(--soft)} .card.lead p{color:#1f2610}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--lime);color:var(--night);text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--chalk);border:1px solid var(--line)}
.btn.dark{background:var(--night);color:var(--lime)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.back{background:none;border:0;color:var(--lime);font-weight:700;padding:0;margin-bottom:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;min-height:84px}
.tile b{display:block;font:800 16px var(--head);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}
.tile small{color:var(--muted);font-size:12px}
.tile.soon{opacity:.55}
.big{font:800 44px/1 var(--head)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono)}
.muted{color:var(--muted)} .coral{color:var(--coral)} .lime{color:var(--lime)} .gold{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--lime);color:var(--night);border-color:var(--lime);font-weight:700}
textarea,input[type=text],select{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.q{counter-increment:q}
.q h3{font-size:16px;line-height:1.2}
.q h3::before{content:counter(q) ". ";color:var(--lime)}
.qlist{counter-reset:q}
.saved{font:600 11px var(--mono);color:var(--lime)}
.sticky{position:sticky;bottom:calc(var(--bot) + 76px);background:linear-gradient(transparent,var(--night) 30%);padding:18px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 84px);background:var(--chalk);color:var(--night);
  padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span:last-child{text-align:right}
pre{white-space:pre-wrap;font:12px var(--mono);color:var(--soft)}
nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:2px;left:55%;background:var(--coral);color:#fff;font:700 10px var(--body);border-radius:99px;padding:1px 5px}
.hscroll{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stepper button{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.stepper button:disabled{opacity:.3}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs .sc{font:800 40px/1 var(--head)} .vs .tn{font:800 14px/1.15 var(--head);text-transform:uppercase;letter-spacing:.03em}
.vs .meta{font:11px var(--mono);color:var(--muted)}
.vs .win .sc{color:var(--lime)}
.lu{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.lu td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:top}
.lu td.sl{width:42px;text-align:center;font:600 10px var(--mono);color:var(--muted);vertical-align:middle}
.lu .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .sub{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu .pt{font:700 13px var(--mono)} .lu .r{text-align:right}
.game{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.game:last-child{border:0}
.game .s{font:700 14px var(--mono);text-align:right}
.game .w{color:var(--lime)} .game.mine{background:linear-gradient(90deg,rgba(184,224,74,.08),transparent)}
.ro td{padding:8px 4px}
.tag{display:inline-block;font:700 9.5px var(--mono);padding:2px 5px;border-radius:5px;background:var(--raised);color:var(--gold);border:1px solid var(--line);vertical-align:1px}
.inj{color:var(--coral);font:700 10px var(--mono)}
.rooms .kv{cursor:pointer;align-items:center}
.unread{background:var(--coral);color:#fff;border-radius:99px;font:700 11px var(--body);padding:2px 7px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
.msg{max-width:80%;padding:8px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--lime);color:var(--night);border-color:var(--lime)}
.msg .who{font:700 11px var(--body);color:var(--gold);margin-bottom:2px}
.msg .t{font:10px var(--mono);opacity:.6;margin-top:3px}
.msg.del{opacity:.5;font-style:italic}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 62px);background:var(--night);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;z-index:9}
.composer textarea{min-height:40px;max-height:120px;height:40px;flex:1;padding:9px 10px}
</style>
</head>
<body>
<header>
  <img class="crest" src="icons/crest.png?v=2" alt="SPL crest, back to Home" role="link" onclick="go('home')">
  <h1>SPL HQ<small id="sub">State Penn League</small></h1>
  <span class="pill" id="conn">…</span>
  <button class="me" id="meBtn" onclick="go(ME ? 'you' : 'signin')">Sign in</button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-t="home"><span>🏠</span>Home</button>
  <button data-t="match"><span>⚔️</span>Match</button>
  <button data-t="team"><span>🏈</span>Team</button>
  <button data-t="chat"><span>💬</span>Chat</button>
  <button data-t="league"><span>🏆</span>League</button>
</nav>
<div class="toast" id="toast"></div>
<script src="league-data.js"></script>
<script>
"use strict";
// ---- Config. API_URL = the Apps Script web app URL (Deploy → Web app). Public by design: it's not a secret.
var API_URL = "https://script.google.com/macros/s/AKfycbyGjG8LNEpCBceV5DulbfyMGLk7_NnW_W8q_y0sq47-5LEbE9dOu9Rp3rSVK9YEmD_IRw/exec";
var APP_VERSION = "0.3";

// ---- Owners (from data/SPL_Owner_Registry.csv; names + teams only, no contact info ever).
var OWNERS = [
  ["reilly","Joe","Reeling RaMPaGe","East Coast"],["murello","Mike","Bad Attitude Gang","East Coast"],
  ["farrington","Al","Farrington's FREELANCERS","East Coast"],["glen","Glen","Fluff Muffins","North"],
  ["chappie","Drew","BlaKK BoCCes","North"],["sikora","Pete","The Gunz","North"],
  ["hoosier","Hoos","Hoosier's Dynamos","Philly"],["patel","Amit","Cheater's Streakers","Philly"],
  ["salerno","Owen","Ween's Machine","Philly"],["moyer","Rich","Kimble's Finast","West Coast"],
  ["bucher","Seth","Los Beasters Big Sky","West Coast"],["smith","Matt","Tijuana Trojans","West Coast"]
].map(function (r) { return { id: r[0], name: r[1], team: r[2], div: r[3] }; });

// ---- Questions for Joe (decisions the trade center + keeper engine need). Add new ones at the end; never reuse a qid.
var QUESTIONS = [
  { qid: "espn_lm", q: "Will you make Mike's team a league manager (co-commish) in SPL on ESPN?",
    why: "The app executes approved trades on ESPN by itself. ESPN only allows that from a league manager's login.",
    choices: ["Yes, now", "Yes, after the demo", "Let's talk"] },
  { qid: "test_league", q: "Will you join the test league as co-commish for the demo?",
    why: "We prove trades end to end in a throwaway ESPN league first. Nothing touches the real SPL league until you sign off.",
    choices: ["Yes, send the invite", "Show me first"] },
  { qid: "keeper_travels", q: "When a player under a keeper contract is traded, what happens to the contract?",
    why: "The trade center has to move picks and keeper contracts along with players.",
    choices: ["Contract travels as-is (KP, years)", "Contract resets", "Depends (explain below)"] },
  { qid: "pick_years", q: "How many seasons ahead can draft picks be traded?",
    why: "Sets which future picks show up in the trade builder.",
    choices: ["Next season only", "2 seasons", "3 seasons", "No limit"] },
  { qid: "trade_review", q: "How should trade approval work?",
    why: "Every accepted trade lands on your desk in the app.",
    choices: ["I approve every trade", "Auto-approve after a review window", "League veto vote", "Other (explain)"] },
  { qid: "review_window", q: "If there's a review window, how long?",
    why: "The robot waits this long before executing on ESPN.",
    choices: ["None", "12 hours", "24 hours", "48 hours"] },
  { qid: "deadlines", q: "What are the key dates? (trade deadline, keeper deadline, Slot + Divisional draft)",
    why: "Deadlines lock buttons in the app and drive reminder cards.",
    choices: [] },
  { qid: "chat", q: "Chat: should the app have league chat, or keep the group text?",
    why: "Trade talk will live in the app either way (DMs on each offer).",
    choices: ["Full league chat in the app", "Trade DMs only, keep the group text", "Not sure yet"] },
  { qid: "al_name", q: "ESPN lists Al's team under \"James Farrington\". Same person?",
    why: "Owner names are the join key across all history.",
    choices: ["Yes, Al = James", "No (explain)"] },
  { qid: "first_wish", q: "If the app could do one thing for you as commish, what would it be?",
    why: "Your answer goes to the top of the build list.", choices: [] }
];

// ---- tiny helpers
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2600); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("spl_" + k) || "null"); localStorage.setItem("spl_" + k, JSON.stringify(v)); } catch (e) { return null; } }
function owner(id) { return OWNERS.filter(function (o) { return o.id === id; })[0]; }
function teamOwner(name) { var n = String(name || "").toLowerCase(); return OWNERS.filter(function (o) { return o.team.toLowerCase() === n; })[0]; }
function api(action, body) {
  if (!API_URL) return Promise.reject(new Error("Backend not connected yet"));
  if (!body) return fetch(API_URL + "?action=" + action).then(function (r) { return r.json(); });
  body.action = action;
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
var cache = {};
function load(action, maxAgeMs) {
  var c = cache[action]; if (c && Date.now() - c.at < (maxAgeMs || 60000)) return Promise.resolve(c.data);
  return api(action).then(function (d) { cache[action] = { at: Date.now(), data: d }; return d; });
}

// ---- session: passphrase once → device token kept on this phone (a new passphrase signs old phones out)
var ME = store("me"), MY = {};
function isRole(r) { return !!ME && String(ME.role || "").split(/[,\s]+/).indexOf(r) >= 0; }
function isDesk() { return isRole("commish") || isRole("ops"); }
function authed(action, body) {
  body = body || {}; body.token = store("token");
  return api(action, body).then(function (r) { if (r && r.auth) { signOut(true); throw new Error("Please sign in again."); } return r; });
}
function setMe(r) { ME = r.me; store("me", ME); if (r.myAnswers) MY = r.myAnswers; paintMe(); }
function signOut(quiet) { store("token", null); store("me", null); ME = null; MY = {}; paintMe(); if (!quiet) { toast("Signed out"); go("home"); } }
function paintMe() { var b = $("#meBtn"); if (b) b.textContent = ME ? ME.name.slice(0, 2).toUpperCase() : "Sign in"; }
function needSignIn(what) {
  return '<div class="card"><div class="eyebrow">🔑 Owners only</div><h3>Sign in ' + what + '</h3><p>Use the passphrase the commish sent you.</p>' +
    '<p style="margin-top:12px"><button class="btn" onclick="go(\'signin\')">Sign in</button></p></div>';
}

// ---- router
var SCREENS = {}, TAB_OF = { signin: "home", you: "home", home: "home", match: "match", team: "team", chat: "chat", league: "league", standings: "league", joe: "league", feedback: "league", ops: "league", soon: "league" };
function go(name, arg) { location.hash = name + (arg ? "=" + arg : ""); }
function render() {
  clearTimers();
  var h = (location.hash || "#home").slice(1).split("="), name = h[0] || "home", arg = h[1];
  if (!SCREENS[name]) name = "home";
  document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === TAB_OF[name]); });
  $("#view").innerHTML = SCREENS[name](arg); window.scrollTo(0, 0);
  if (SCREENS[name].after) SCREENS[name].after(arg);
}
window.addEventListener("hashchange", render);
document.querySelectorAll("#tabs button").forEach(function (b) { b.onclick = function () { go(b.dataset.t); }; });
function back(to, label) { return '<button class="back" onclick="go(\'' + to + '\')">‹ ' + label + '</button>'; }

// ---- Home
SCREENS.home = function () {
  var answered = Object.keys(MY || {}).length;
  return (ME ? '' : '<div class="card"><div class="eyebrow">🔑 SPL owners</div><h3>Sign in</h3><p>Got a passphrase from the commish? Sign in once on this phone.</p><p style="margin-top:12px"><button class="btn" onclick="go(\'signin\')">Sign in</button></p></div>') +
    '<div class="card lead"><div class="eyebrow">🏗️ Under construction · v' + APP_VERSION + '</div>' +
    '<h2 style="margin:0">The SPL, in your pocket.</h2><p>Trades with picks and keeper contracts that execute on ESPN by themselves, the keeper room, 25 years of history, and a desk for the commish.</p></div>' +
    (isDesk() ? '<div class="card"><div class="eyebrow">📋 For the commish</div><h3>' + (ME.owner === "reilly" ? "Your questions, Joe" : "Questions for the commish") + '</h3>' +
    '<p>' + QUESTIONS.length + ' quick calls that shape how trades and keepers work in the app.' + (answered ? ' <span class="lime">' + answered + ' of ' + QUESTIONS.length + ' answered.</span>' : '') + '</p>' +
    '<p style="margin-top:12px"><button class="btn" onclick="go(\'joe\')">' + (answered ? "Review answers" : "Answer them") + '</button></p></div>' : '') +
    (ME ? '<div class="card" id="homeGame" onclick="go(\'match\')" style="cursor:pointer"><div class="eyebrow">⚔️ Your game</div><p class="muted">Loading…</p></div>' : '') +
    '<div class="card" id="homeStand"><div class="eyebrow">📊 Live from ESPN · SPL ' + 2026 + '</div><h3>Standings</h3><p class="muted">Loading…</p></div>' +
    '<div class="card"><div class="eyebrow">💡 Ideas &amp; feedback</div><h3>Tell us what you want</h3><p>Anything: ideas, gripes, what you\'d love to see.</p>' +
    '<p style="margin-top:12px"><button class="btn ghost" onclick="go(\'feedback\')">Send a note</button></p></div>';
};
SCREENS.home.after = function () {
  if (ME && $("#homeGame")) authed("week", {}).then(function (d) {
    var el = $("#homeGame"); if (!el || !d.ok) return; WEEK = d;
    var g = d.games.filter(function (x) { return (x.home && x.home.owner === ME.owner) || (x.away && x.away.owner === ME.owner); })[0];
    if (!g) { el.innerHTML = '<div class="eyebrow">⚔️ Week ' + d.week + '</div><p>No game for you this week.</p>'; return; }
    var m = g.home.owner === ME.owner ? g.home : g.away, o = m === g.home ? g.away : g.home, up = m.pts >= o.pts;
    el.innerHTML = '<div class="eyebrow">⚔️ Your game · Week ' + d.week + (d.final ? " · Final" : "") + '</div><div class="row" style="justify-content:space-between">' +
      '<div><b class="big ' + (up ? "lime" : "") + '">' + fmtPts(m.pts) + '</b><br><small class="muted">You</small></div><div class="muted">vs</div>' +
      '<div style="text-align:right"><b class="big">' + fmtPts(o.pts) + '</b><br><small class="muted">' + esc(oname(o.owner) || o.team) + '</small></div></div>' +
      '<p style="margin-top:8px">' + (d.final ? (up ? "Win." : "Loss.") : (m.left + o.left ? m.left + " of yours and " + o.left + " of theirs still to play." : "All players done.")) + ' Tap for lineups.</p>';
  }).catch(function () { var el = $("#homeGame"); if (el) el.remove(); });
  load("standings", 300000).then(function (d) {
    var el = $("#homeStand"); if (!el) return;
    if (!d.ok) throw new Error(d.error);
    var t = sortTeams(d.teams).slice(0, 4);
    el.innerHTML = '<div class="eyebrow">📊 Live from ESPN · ' + esc(d.name || "SPL") + (d.week ? " · Week " + d.week : "") + '</div><h3>Top of the table</h3>' +
      '<table>' + t.map(function (x, i) { return '<tr><td class="muted">' + (i + 1) + '</td><td>' + esc(x.name) + '</td><td class="n">' + x.w + '–' + x.l + (x.t ? '–' + x.t : '') + '</td></tr>'; }).join("") + '</table>' +
      '<p style="margin-top:10px"><button class="btn ghost" onclick="go(\'standings\')">Full standings</button></p>';
  }).catch(function (e) { var el = $("#homeStand"); if (el) el.querySelector("p").textContent = e.message; });
};

// ---- shared bits for Match / Team / Chat
function oname(id) { var o = owner(id); return o ? o.name : (id || "?"); }
function fmtPts(x) { return x == null ? "–" : (Math.round(x * 10) / 10).toFixed(1); }
function kickTime(ms) { if (!ms) return ""; var d = new Date(ms); return d.toLocaleDateString([], { weekday: "short" }) + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
var timers = []; function clearTimers() { timers.forEach(clearInterval); timers = []; }

// ---- placeholders for tabs not built yet
function soon(title, what) {
  return '<h2>' + title + '</h2><div class="card"><div class="eyebrow">Coming soon</div><p>' + what + '</p></div>';
}
// ---- ⚔️ Match: your game this week (live from ESPN) + every game
var WEEK = null;
SCREENS.match = function (arg) {
  if (!ME) return '<h2>Match</h2>' + needSignIn("to see your matchup");
  return '<h2>Match</h2><div id="mt"><div class="card"><p class="muted">Loading from ESPN…</p></div></div>';
};
SCREENS.match.after = function (arg) {
  if (!$("#mt")) return;
  var parts = String(arg || "").split(":"), wk = Number(parts[0]) || null, gi = parts[1] != null && parts[1] !== "" ? Number(parts[1]) : null;
  var draw = function (d) {
    if (!$("#mt")) return;
    if (!d.ok) { $("#mt").innerHTML = '<div class="card"><p class="coral">' + esc(d.error) + '</p></div>'; return; }
    WEEK = d;
    var mineIdx = -1; d.games.forEach(function (g, i) { if ((g.home && g.home.owner === ME.owner) || (g.away && g.away.owner === ME.owner)) mineIdx = i; });
    var show = gi != null ? gi : mineIdx >= 0 ? mineIdx : 0, g = d.games[show];
    var html = '<div class="stepper"><button ' + (d.week <= 1 ? "disabled" : "") + ' onclick="go(\'match\',' + (d.week - 1) + ')">‹</button>' +
      '<div style="text-align:center"><b style="font:800 18px var(--head);text-transform:uppercase">Week ' + d.week + '</b><br><small class="muted">' + (d.final ? "Final" : d.week === d.current ? "Live · updates every minute" : "Upcoming") + '</small></div>' +
      '<button ' + (d.week >= 17 ? "disabled" : "") + ' onclick="go(\'match\',' + (d.week + 1) + ')">›</button></div>';
    if (!g) { $("#mt").innerHTML = html + '<div class="card"><p class="muted">No games this week.</p></div>'; return; }
    var me = g.away && g.away.owner === ME.owner ? "away" : "home", L = g[me], R = g[me === "home" ? "away" : "home"];
    if (show !== mineIdx) { L = g.home; R = g.away; }
    var lead = function (a, b) { return a && b && a.pts > b.pts; };
    var hdr = function (t, w) { return '<div class="' + (w ? "win" : "") + '"><div class="sc">' + fmtPts(t.pts) + '</div><div class="tn" style="margin-top:6px">' + esc(t.team) + '</div><div class="meta">' + esc(oname(t.owner)) + ' · ' + esc(t.rec) + (t.proj != null && !d.final ? '<br>proj ' + fmtPts(t.proj) : '') + (!d.final && t.left ? ' · ' + t.left + ' to play' : '') + '</div></div>'; };
    html += '<div class="card"><div class="eyebrow">' + (show === mineIdx ? "⚔️ Your game" : "⚔️ Game") + (g.playoff ? " · Playoffs" : "") + '</div>' +
      '<div class="vs">' + hdr(L, lead(L, R)) + '<div class="muted" style="font:800 14px var(--head)">VS</div>' + hdr(R, lead(R, L)) + '</div></div>';
    var starters = function (t) { return t.players.filter(function (p) { return p.slot !== "BE" && p.slot !== "IR"; }); };
    var bench = function (t) { return t.players.filter(function (p) { return p.slot === "BE" || p.slot === "IR"; }); };
    var cell = function (p, right) {
      if (!p) return '<td></td>';
      var sub = esc(p.pos + (p.tm ? " · " + p.tm : "")) + (p.opp ? " " + esc(p.opp) : "") + (p.st ? " · " + esc(p.st) : (!p.played && p.kick ? " · " + kickTime(p.kick) : "")) + (p.inj ? ' <span class="inj">' + esc(p.inj) + '</span>' : '');
      var pts = '<span class="pt' + (p.played ? "" : " muted") + '">' + (p.played ? fmtPts(p.pts) : (p.proj != null ? fmtPts(p.proj) : "–")) + '</span>';
      return right ? '<td class="r"><div class="nm">' + pts + ' ' + esc(p.n) + '</div><div class="sub">' + sub + '</div></td>'
                   : '<td><div class="nm">' + esc(p.n) + ' ' + pts + '</div><div class="sub">' + sub + '</div></td>';
    };
    var table = function (a, b, label) {
      var n = Math.max(a.length, b.length), rows = "";
      for (var i = 0; i < n; i++) rows += '<tr>' + cell(a[i], false) + '<td class="sl">' + esc((a[i] || b[i]).slot) + '</td>' + cell(b[i], true) + '</tr>';
      return '<div class="card" style="padding:12px"><div class="eyebrow">' + label + '</div><table class="lu">' + rows + '</table></div>';
    };
    html += table(starters(L), starters(R), "Lineups · grey = projected, not played yet");
    html += '<details class="card" style="padding:12px"><summary class="eyebrow" style="cursor:pointer">Bench</summary>' + table(bench(L), bench(R), "").replace('<div class="card" style="padding:12px">', '<div>') + '</details>';
    html += '<div class="card"><div class="eyebrow">🏟️ Every game · Week ' + d.week + '</div>' + d.games.map(function (x, i) {
      var a = x.away || {}, h = x.home || {}, aw = a.pts > h.pts, hw = h.pts > a.pts;
      return '<div class="game' + (i === mineIdx ? " mine" : "") + '" onclick="go(\'match\',\'' + d.week + ':' + i + '\')">' +
        '<div class="' + (aw ? "w" : "") + '">' + esc(a.team) + ' <small class="muted">' + esc(oname(a.owner)) + '</small></div><div class="s ' + (aw ? "w" : "") + '">' + fmtPts(a.pts) + '</div>' +
        '<div class="' + (hw ? "w" : "") + '">' + esc(h.team) + ' <small class="muted">' + esc(oname(h.owner)) + '</small></div><div class="s ' + (hw ? "w" : "") + '">' + fmtPts(h.pts) + '</div></div>';
    }).join("") + '</div><p class="muted" style="font-size:12px">From ESPN · ' + new Date(d.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + '</p>';
    $("#mt").innerHTML = html;
  };
  var pull = function () { authed("week", { week: wk }).then(draw).catch(function (e) { if ($("#mt")) $("#mt").innerHTML = '<div class="card"><p class="coral">' + esc(e.message) + '</p></div>'; }); };
  pull(); timers.push(setInterval(function () { if (WEEK && WEEK.week === WEEK.current && !document.hidden) pull(); }, 60000));
};

// ---- 🏈 Team: any SPL roster + keeper contracts

  if (!ME) return '<h2>Team</h2>' + needSignIn("to see rosters");

  return '<div class="hscroll">' + OWNERS.map(function (o) { return '<button class="chip' + (o.id === id ? " on" : "") + '" onclick="go(\'team\',\'' + o.id + '\')">' + esc(o.name) + '</button>'; }).join("") + '</div>' +
    '<div id="tm"><div class="card"><p class="muted">Loading from ESPN…</p></div></div>';
};
SCREENS.team.after = function (arg) {
  if (!$("#tm")) return;
  var id = arg || ME.owner, o = owner(id) || {};

    if (!$("#tm")) return;
    if (!d.ok) throw new Error(d.error);
    ROSTERS = d;
    var t = d.teams.filter(function (x) { return x.owner === id; })[0];
    var cs = contractsOf(id), kept = {}; cs.forEach(function (c) { if (c.status === "active") kept[c.player.toLowerCase()] = c; });
    var html = '<div class="card' + (id === ME.owner ? " lead" : "") + '"><div class="eyebrow">' + (id === ME.owner ? "🏈 Your team" : "🏈 " + esc(o.name) + "'s team") + ' · ' + esc(o.div || "") + '</div>' +
      '<h2 style="margin:0">' + esc(t ? t.team : o.team) + '</h2><p>' + esc(o.full || o.name || "") + (t ? ' · ' + esc(t.rec) : '') + '</p></div>';
    if (cs.length) {
      var yrs = ["2026", "2027", "2028"];
      html += '<div class="card"><div class="eyebrow">🔒 Keeper contracts</div><table><tr><th>Player</th>' + yrs.map(function (y) { return '<th class="n">' + y.slice(2) + '</th>'; }).join("") + '</tr>' +
        cs.map(function (c) {

          return '<tr><td>' + esc(c.player) + ' <small class="muted">' + esc(c.pos) + '</small>' + (c.tag ? ' <span class="tag">TAG</span>' : '') + (cut ? ' <span class="tag" style="color:var(--coral)">CUT</span>' : '') +
            '<br><small class="muted">' + c.term + '-yr · signed ' + c.signed + '</small></td>' +
            yrs.map(function (y) { var v = cut ? c.pen[y] : c.kp[y]; return '<td class="n' + (cut && v != null ? " coral" : "") + '">' + (v == null ? '<span class="muted">·</span>' : v === "F" ? '<span class="gold">F</span>' : v) + '</td>'; }).join("") + '</tr>';
        }).join("") + '</table><p class="muted" style="font-size:12px">KP by season · F = franchise tag year · red = cap penalty from a cut. From the 2026 Keeper Matrix.</p></div>';
    }

    var group = function (label, list) {

        list.map(function (p) {

            '<br><small class="muted">' + esc(p.pos) + ' · ' + esc(p.tm) + (p.acq ? ' · ' + esc(p.acq) : '') + '</small>' + (p.inj ? ' <span class="inj">' + esc(p.inj) + '</span>' : '') + '</td>' +
            '<td class="n">' + fmtPts(p.sp) + '</td><td class="n">' + fmtPts(p.avg) + '</td></tr>';

    html += group("IR", t.players.filter(function (p) { return p.slot === "IR"; }));

      '<p class="muted" style="font-size:12px">Rosters from ESPN · ' + new Date(d.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + (d.stale ? " (ESPN hiccup: last good copy)" : "") + '</p>';
    $("#tm").innerHTML = html;
  };
  (ROSTERS && Date.now() - new Date(ROSTERS.at).getTime() < 600000 ? Promise.resolve(ROSTERS) : authed("rosters")).then(draw)

// ---- 💬 Chat: league room + DMs
function dmRoom(other) { var a = [ME.owner, other].sort(); return "dm:" + a[0] + "," + a[1]; }
function roomName(room) { if (room === "league") return "League chat"; var ids = room.slice(3).split(","); return oname(ids[0] === ME.owner ? ids[1] : ids[0]); }
function seen(room, ts) { var s = store("seen") || {}; if (ts === undefined) return s[room] || 0; s[room] = ts; store("seen", s); }
var CHAT = { rooms: [] };
function unreadCount() { return (CHAT.rooms || []).filter(function (r) { return r.who !== (ME && ME.owner) && new Date(r.last).getTime() > seen(r.room); }).length; }
function paintBadge() {
  var b = document.querySelector('#tabs button[data-t="chat"]'), n = ME ? unreadCount() : 0, el = b.querySelector(".badge");
  if (n && !el) { el = document.createElement("i"); el.className = "badge"; b.appendChild(el); }
  if (el) { if (n) el.textContent = n; else el.remove(); }
}
function pollRooms() { if (!ME || !store("token")) return Promise.resolve(); return authed("chat").then(function (r) { if (r.ok) { CHAT.rooms = r.rooms; paintBadge(); } return r; }); }
SCREENS.chat = function (room) {
  if (!ME) return '<h2>Chat</h2>' + needSignIn("to chat");
  if (room) return back("chat", "Chat") + '<h2>' + esc(roomName(room)) + '</h2><div class="msgs" id="msgs"><p class="muted">Loading…</p></div>' +
    '<div class="composer"><textarea id="cmsg" placeholder="Message" maxlength="500"></textarea><button class="btn" id="csend">Send</button></div>';
  return '<h2>Chat</h2><div class="card rooms" id="rooms"><p class="muted">Loading…</p></div>' +
    '<div class="card"><div class="eyebrow">✉️ New message</div><div class="chips">' + OWNERS.filter(function (o) { return o.id !== ME.owner; }).map(function (o) {
      return '<button class="chip" onclick="go(\'chat\',\'' + dmRoom(o.id) + '\')">' + esc(o.name) + '</button>'; }).join("") + '</div></div>';
};
SCREENS.chat.after = function (room) {
  if (!ME) return;
  if (!room) {
    var drawRooms = function () {
      var list = CHAT.rooms.slice(); if (!list.some(function (r) { return r.room === "league"; })) list.unshift({ room: "league", n: 0 });
      list.sort(function (a, b) { return (a.room === "league" ? -1 : 0) - (b.room === "league" ? -1 : 0) || new Date(b.last || 0) - new Date(a.last || 0); });
      if ($("#rooms")) $("#rooms").innerHTML = '<div class="eyebrow">💬 Rooms</div>' + list.map(function (r) {
        var un = r.who !== ME.owner && r.last && new Date(r.last).getTime() > seen(r.room);
        return '<div class="kv" onclick="go(\'chat\',\'' + r.room + '\')"><span><b>' + (r.room === "league" ? "🏟️ " : "👤 ") + esc(roomName(r.room)) + '</b><br><small class="muted">' +
          (r.text ? esc(oname(r.who)) + ': ' + esc(r.text) : "No messages yet") + '</small></span><span>' + (un ? '<span class="unread">new</span>' : (r.last ? '<small class="muted">' + ago(r.last) + '</small>' : '')) + '</span></div>';
      }).join("");
    };
    drawRooms(); pollRooms().then(drawRooms); timers.push(setInterval(function () { if (!document.hidden) pollRooms().then(drawRooms); }, 20000));
    return;
  }
  var msgs = [], last = null;
  var draw = function () {
    var el = $("#msgs"); if (!el) return;
    var atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    el.innerHTML = msgs.length ? msgs.map(function (m) {
      var mine = m.who === ME.owner, t = new Date(m.ts);
      return '<div class="msg' + (mine ? " me" : "") + (m.del ? " del" : "") + '" ' + (mine && !m.del ? 'onclick="delMsg(\'' + esc(m.id) + '\')"' : (isRole("commish") && room === "league" && !m.del ? 'onclick="delMsg(\'' + esc(m.id) + '\')"' : '')) + '>' +
        (!mine && room === "league" ? '<div class="who">' + esc(oname(m.who)) + '</div>' : '') + (m.del ? "Message deleted" : esc(m.text).replace(/\n/g, "<br>")) +
        '<div class="t">' + t.toLocaleDateString([], { month: "short", day: "numeric" }) + ' ' + t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + '</div></div>';
    }).join("") : '<p class="muted">No messages yet. Say something.</p>';
    if (atBottom || !last) window.scrollTo(0, document.body.scrollHeight);
  };
  var pull = function () {
    return authed("chat", { room: room }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      msgs = r.msgs; last = msgs.length ? msgs[msgs.length - 1].ts : last; CHAT.rooms = r.rooms; seen(room, Date.now()); paintBadge(); draw();
    }).catch(function (e) { if ($("#msgs")) $("#msgs").innerHTML = '<p class="coral">' + esc(e.message) + '</p>'; });
  };
  pull(); timers.push(setInterval(function () { if (!document.hidden) pull(); }, 8000));
  window.delMsg = function (id) { if (!confirm("Delete this message?")) return; authed("chatdel", { id: id }).then(function (r) { if (!r.ok) throw new Error(r.error); pull(); }).catch(function (e) { toast(e.message); }); };
  var send = function () {
    var ta = $("#cmsg"), text = ta.value.trim(); if (!text) return;
    var btn = $("#csend"); btn.disabled = true;
    authed("chatsend", { room: room, text: text }).then(function (r) {
      if (!r.ok) throw new Error(r.error); ta.value = ""; msgs.push(r.msg); draw(); window.scrollTo(0, document.body.scrollHeight);
    }).catch(function (e) { toast(e.message); }).then(function () { btn.disabled = false; });
  };
  $("#csend").onclick = send;
  $("#cmsg").onkeydown = function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
};

// ---- Standings
function sortTeams(ts) {
  return ts.slice().sort(function (a, b) {
    if (a.seed && b.seed) return a.seed - b.seed;
    return (b.w - b.l) - (a.w - a.l) || b.pf - a.pf;
  });
}
SCREENS.standings = function () { return back("league", "League") + '<h2>Standings</h2><div id="stand" class="card"><p class="muted">Loading from ESPN…</p></div>'; };
SCREENS.standings.after = function () {
  load("standings", 300000).then(function (d) {
    if (!d.ok) throw new Error(d.error);
    var byDiv = {}; d.teams.forEach(function (t) { (byDiv[t.div || "League"] = byDiv[t.div || "League"] || []).push(t); });

    var html = '<div class="eyebrow">' + esc(d.name) + (d.week ? " · Week " + d.week : "") + ' · ESPN</div><h3>Overall</h3><table><tr><th>#</th><th>Team</th><th class="n">W–L</th><th class="n">PF</th></tr>' +

    Object.keys(byDiv).sort().forEach(function (k) {

  if (!ME) return SCREENS.signin();
  var roles = String(ME.role || "owner").split(/[,\s]+/).map(function (r) { return { owner: "Owner", commish: "Commissioner", ops: "Ops (site)" }[r] || r; }).join(" · ");
  return back("home", "Home") + '<h2>' + esc(ME.name) + '</h2><div class="card"><div class="kv"><span>Team</span><span>' + esc(ME.team) + '</span></div>' +
    '<div class="kv"><span>Role</span><span>' + esc(roles) + '</span></div></div>' +
    '<div class="card"><p style="margin:0">Signed in on this phone. A new passphrase from the commish signs every phone out.</p><p style="margin-top:12px"><button class="btn ghost" onclick="signOut()">Sign out</button></p></div>';
};

// ---- Questions for Joe
function joeDraft() {
  var d = store("answers") || {};
  Object.keys(MY || {}).forEach(function (q) { if (!d[q] || d[q].sent) d[q] = { choice: MY[q].choice || "", note: MY[q].note || "", sent: true }; });
  return d;
}
SCREENS.joe = function () {
  if (!ME) return back("home", "Home") + '<h2>Questions for the commish</h2>' + needSignIn("to answer");
  if (!isDesk()) return back("league", "League") + '<h2>Questions</h2><div class="card"><p style="margin:0">These are for the commish.</p></div>';
  var draft = joeDraft();
  return back("league", "League") + '<h2>Questions for the commish</h2>' +
    '<div class="card"><p style="margin:0">' + (ME.owner === "reilly" ? "Joe, these" : "These") + ' decide how trades, picks and keeper contracts work in the app. Tap an answer, add a note if you want, and hit <b>Send answers</b>. Skip anything; come back anytime and change an answer.</p></div>' +
    '<div class="qlist">' + QUESTIONS.map(function (q) {
      var a = draft[q.qid] || {};
      return '<div class="card q" data-q="' + q.qid + '"><h3>' + esc(q.q) + '</h3><p style="font-size:13px">' + esc(q.why) + '</p>' +
        (q.choices.length ? '<div class="chips">' + q.choices.map(function (c) { return '<button class="chip' + (a.choice === c ? " on" : "") + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join("") + '</div>' : '<div style="height:10px"></div>') +
        '<textarea placeholder="' + (q.choices.length ? "Note (optional)" : "Your answer") + '">' + esc(a.note || "") + '</textarea>' +
        (a.sent ? '<div class="saved">✓ sent</div>' : '') + '</div>';
    }).join("") + '</div>' +
    '<div class="sticky"><button class="btn" style="width:100%" id="sendAns">Send answers</button></div>';
};
SCREENS.joe.after = function () {
  if (!$("#sendAns")) return;
  var draft = joeDraft();
  document.querySelectorAll(".q").forEach(function (card) {
    var qid = card.dataset.q;
    card.querySelectorAll(".chip").forEach(function (ch) {
      ch.onclick = function () {
        var on = !ch.classList.contains("on");
        card.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("on"); });
        if (on) ch.classList.add("on");
        draft[qid] = draft[qid] || {}; draft[qid].choice = on ? ch.dataset.c : ""; draft[qid].sent = false; store("answers", draft);
      };
    });
    card.querySelector("textarea").oninput = function (e) { draft[qid] = draft[qid] || {}; draft[qid].note = e.target.value; draft[qid].sent = false; store("answers", draft); };
  });
  $("#sendAns").onclick = function () {
    var items = QUESTIONS.filter(function (q) { var a = draft[q.qid]; return a && !a.sent && ((a.choice || "").trim() || (a.note || "").trim()); })
      .map(function (q) { var a = draft[q.qid]; return { qid: q.qid, question: q.q, choice: a.choice || "", note: a.note || "" }; });
    if (!items.length) { toast("Nothing new to send"); return; }
    var btn = this; btn.disabled = true; btn.textContent = "Sending…";
    authed("answers", { items: items }).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      items.forEach(function (it) { draft[it.qid].sent = true; }); store("answers", draft); MY = r.myAnswers || MY;
      toast("✓ Sent " + r.saved + " answer" + (r.saved > 1 ? "s" : "") + ". Thanks!"); render();
    }).catch(function (e) { toast(e.message); btn.disabled = false; btn.textContent = "Send answers"; });
  };
};

// ---- Ideas & feedback
SCREENS.feedback = function () {
  if (!ME) return back("league", "League") + '<h2>Ideas &amp; feedback</h2>' + needSignIn("to send a note");
  return back("league", "League") + '<h2>Ideas &amp; feedback</h2><div class="card">' +
    '<div class="chips" id="fbMood">' + ["😍 Love it", "👍 Good", "🤔 Confusing", "👎 Not for me"].map(function (m) { return '<button class="chip" data-m="' + m + '">' + m + '</button>'; }).join("") + '</div>' +
    '<textarea id="fbNote" placeholder="Ideas, gripes, kudos, what you want to see…" style="min-height:120px"></textarea>' +
    '<p style="margin-top:12px"><button class="btn" id="fbSend">Send</button></p></div>';
};
SCREENS.feedback.after = function () {
  if (!$("#fbSend")) return;
  var mood = "";
  document.querySelectorAll("#fbMood .chip").forEach(function (c) { c.onclick = function () { document.querySelectorAll("#fbMood .chip").forEach(function (x) { x.classList.remove("on"); }); c.classList.add("on"); mood = c.dataset.m; }; });
  $("#fbSend").onclick = function () {
    var btn = this; btn.disabled = true;
    authed("feedback", { mood: mood, note: $("#fbNote").value, kind: "idea", where: "feedback" }).then(function (r) {
      if (!r.ok) throw new Error(r.error); toast("✓ Sent. Thanks!"); go("home");
    }).catch(function (e) { toast(e.message); btn.disabled = false; });
  };
};

// ---- 🛠️ Ops desk (Mike): is everything connected and working?
SCREENS.ops = function () {
  if (!ME) return back("league", "League") + '<h2>🛠️ Ops desk</h2>' + needSignIn("to open the desk");
  if (!isDesk()) return back("league", "League") + '<h2>🛠️ Ops desk</h2><div class="card"><p style="margin:0">Commish and ops only.</p></div>';
  return back("league", "League") + '<h2>🛠️ Ops desk</h2>' +
    '<div id="issued"></div>' +
    '<div class="card" id="opsOwners"><div class="eyebrow">🔑 Owners &amp; passphrases</div><p class="muted">Loading…</p></div>' +
    '<div class="card" id="opsHealth"><div class="eyebrow">System</div><p class="muted">Checking…</p></div>' +
    '<div class="card" id="opsAns"><div class="eyebrow">📋 Joe\'s answers</div><p class="muted">Loading…</p></div>' +
    '<div class="card"><div class="eyebrow">App</div><div class="kv"><span>App version</span><span>' + APP_VERSION + '</span></div>' +
    '<div class="kv"><span>Backend URL</span><span>' + (API_URL ? '<span class="lime">set</span>' : '<span class="coral">not set</span>') + '</span></div>' +
    '<div class="kv"><span>Home Screen app</span><span>' + (navigator.standalone || matchMedia("(display-mode: standalone)").matches ? "yes" : "no (browser)") + '</span></div></div>';
};
function ago(ts) {
  if (!ts) return "never"; var m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  return m < 2 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
}
function issuePass(id, name, had) {
  if (!confirm(had ? "Give " + name + " a NEW passphrase? It signs out every phone they're signed in on." : "Make a passphrase for " + name + "?")) return;
  authed("issue", { owner: id }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    var msg = name + ", you're in for SPL HQ. Open " + location.origin + location.pathname + " on your phone (iPhone: Share → Add to Home Screen first), tap Sign in, and use your passphrase: " + r.phrase;
    $("#issued").innerHTML = '<div class="card" style="border-color:var(--lime)"><div class="eyebrow">🔑 New passphrase · shown once</div><h3>' + esc(name) + '</h3>' +
      '<div class="phrase">' + esc(r.phrase) + '</div><p style="font-size:13px">Send it now. It isn\'t stored anywhere readable: if it\'s lost, make a new one.</p>' +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" id="shareP">Text it</button><button class="btn ghost" id="copyP">Copy message</button></div></div>';
    $("#shareP").onclick = function () { if (navigator.share) navigator.share({ text: msg }).catch(function () {}); else location.href = "sms:&body=" + encodeURIComponent(msg); };
    $("#copyP").onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(function () { toast("Copied"); }, function () { prompt("Copy this:", msg); }); };
    window.scrollTo(0, 0); loadDesk();
  }).catch(function (e) { toast(e.message); });
}
function loadDesk() {
  authed("desk").then(function (d) {
    if (!d.ok) throw new Error(d.error);
    $("#opsOwners").innerHTML = '<div class="eyebrow">🔑 Owners &amp; passphrases · ' + d.owners.filter(function (o) { return o.hasPass; }).length + ' of ' + d.owners.length + ' set up</div>' +
      d.owners.map(function (o) {
        var tag = /commish/.test(o.role) ? ' <span class="gold">★</span>' : '';
        return '<div class="kv" style="align-items:center"><span><b>' + esc(o.name) + '</b>' + tag + '<br><small class="muted">' + esc(o.team) + ' · ' +
          (o.hasPass ? (o.lastSeen ? "signed in " + ago(o.lastSeen) : "passphrase made, not signed in yet") : "no passphrase") + '</small></span>' +
          '<span><button class="btn ' + (o.hasPass ? "ghost" : "") + '" style="padding:7px 10px;font-size:13px" onclick="issuePass(\'' + esc(o.owner) + '\',\'' + esc(o.name).replace(/&#39;/g, "") + '\',' + !!o.hasPass + ')">' + (o.hasPass ? "Reset" : "Make one") + '</button></span></div>';
      }).join("");
    var byQ = {}; d.answers.forEach(function (a) { (byQ[a.qid] = byQ[a.qid] || []).push(a); });
    var html = '<div class="eyebrow">📋 Answers · ' + d.total + ' saved</div>' + QUESTIONS.map(function (q) {
      var list = byQ[q.qid] || [];
      return '<div class="kv" style="display:block"><b style="font-size:13px">' + esc(q.q) + '</b><br>' +
        (list.length ? list.map(function (a) { var o = owner(a.who); return '<span class="lime">' + esc(o ? o.name : a.who) + ':</span> ' + esc(a.choice || "") + (a.note ? ' <span class="muted">“' + esc(a.note) + '”</span>' : ''); }).join("<br>") : '<span class="muted">no answer yet</span>') + '</div>';
    }).join("");
    if (d.feedback.length) html += '<div class="eyebrow" style="margin-top:14px">💡 Latest feedback</div>' + d.feedback.map(function (f) { var o = owner(f.who); return '<div class="kv" style="display:block"><span class="lime">' + esc(o ? o.name : f.who) + '</span> ' + esc(f.mood || "") + '<br>' + esc(f.note) + '</div>'; }).join("");
    $("#opsAns").innerHTML = html;
  }).catch(function (e) { var el = $("#opsOwners"); if (el) el.innerHTML = '<p class="coral">' + esc(e.message) + '</p>'; });
}
SCREENS.ops.after = function () {
  if (!$("#opsHealth")) return;
  loadDesk();
  var ok = function (b, t) { return '<span class="' + (b ? "lime" : "coral") + '">' + (b ? "✅ " : "❌ ") + esc(t) + '</span>'; };
  api("health").then(function (h) {
    var e = function (x) { return x.ok ? ok(true, x.name + " · " + x.teams + " teams") : ok(false, x.error); };
    $("#opsHealth").innerHTML = '<div class="eyebrow">System · checked ' + new Date(h.at).toLocaleTimeString() + '</div>' +
      '<div class="kv"><span>Backend</span><span>' + ok(true, "logic v" + h.version) + '</span></div>' +
      '<div class="kv"><span>Sheet</span><span>' + ok(h.sheet, h.sheetName || "not reachable") + '</span></div>' +
      '<div class="kv"><span>ESPN · SPL (read)</span><span>' + e(h.espnRead) + '</span></div>' +
      '<div class="kv"><span>ESPN · test league</span><span>' + e(h.espnTest) + '</span></div>' +
      '<div class="kv"><span>ESPN writes</span><span>' + (h.espnWrites ? '<span class="gold">ON</span>' : '<span class="muted">off</span>') + '</span></div>' +
      '<div class="kv"><span>Emails left today</span><span>' + (h.mailLeft == null ? "?" : h.mailLeft) + '</span></div>' +
      '<div class="kv"><span>Copy emails to Mike</span><span>' + (h.opsEmail ? ok(true, "OPS_EMAIL set") : '<span class="muted">add OPS_EMAIL</span>') + '</span></div>' +
      '<div class="kv"><span>Owners signed up</span><span>' + (h.signedUp == null ? "?" : h.signedUp + " of " + h.owners) + '</span></div>';
  }).catch(function (e) { $("#opsHealth").innerHTML = '<div class="eyebrow">System</div>' + ok(false, e.message); });
};

// ---- connection pill + boot
function pingConn() {
  var el = $("#conn");
  if (!API_URL) { el.textContent = "offline"; el.className = "pill bad"; return; }
  api("health").then(function (h) { el.textContent = h.healthy ? "live" : "check"; el.className = "pill " + (h.healthy ? "ok" : "bad"); })
    .catch(function () { el.textContent = "offline"; el.className = "pill bad"; });
}
paintMe(); render(); pingConn();
setTimeout(function () { pollRooms().catch(function () {}); }, 1500); setInterval(function () { if (!document.hidden) pollRooms().catch(function () {}); }, 60000);
if (store("token")) authed("me").then(function (r) { if (r.ok) { setMe(r); if (/^(home|joe|ops|league)?$/.test(location.hash.replace("#", "").split("=")[0])) render(); } }).catch(function () {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
